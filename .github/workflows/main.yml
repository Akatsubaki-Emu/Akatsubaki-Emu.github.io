name: GitLab to GitHub Pages Mirror

"on":
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - "Update Xthrx's Repo"
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gitlab-to-github-pages
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror canonical GitLab main to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.reconcile.outputs.changed }}
    steps:
      - name: Verify mirror token is configured
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::Missing repository secret MIRROR_TOKEN. Add a fine-grained PAT with Contents and Workflows read/write access."
            exit 1
          fi
      - name: Check out GitHub mirror
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git identity
        run: |
          git config user.name "GitLab Pages Mirror Bot"
          git config user.email "pages-mirror[bot]@users.noreply.github.com"
      - name: Fetch canonical GitLab main
        run: |
          set -euo pipefail
          git remote add gitlab https://gitlab.com/chantinlongxthrx/i-steam.github.io.git
          git fetch --no-tags gitlab main
      - name: Reconcile GitLab changes without force-pushing
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$(git rev-parse origin/main)"
          GITLAB_SHA="$(git rev-parse gitlab/main)"
          echo "GitHub mirror: $GITHUB_SHA"
          echo "GitLab canonical: $GITLAB_SHA"
          if [ "$GITHUB_SHA" = "$GITLAB_SHA" ]; then
            echo "Both repositories already point to the same commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$GITHUB_SHA" "$GITLAB_SHA"; then
            echo "GitLab is ahead; fast-forwarding the GitHub mirror."
            git checkout -B sync-main "$GITLAB_SHA"
          elif git merge-base --is-ancestor "$GITLAB_SHA" "$GITHUB_SHA"; then
            echo "GitHub is ahead of GitLab; preserving GitHub until canonical history catches up."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "Histories have diverged. Merging GitLab into GitHub."
            git checkout -B sync-main "$GITHUB_SHA"
            if git merge --no-ff --no-edit -X theirs gitlab/main; then
              echo "Merged; conflicting file contents prefer canonical GitLab."
            else
              git merge --abort || true
              echo "::error::Could not reconcile the histories safely. GitHub was not changed."
              exit 1
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Push mirror update to GitHub
        if: steps.reconcile.outputs.changed == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          # Use the supplied PAT explicitly; checkout's persisted GITHUB_TOKEN
          # credential is read-only and can shadow a separately configured header.
          git remote set-url origin "https://x-access-token:${MIRROR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          # Remove the credential-bearing URL from local git configuration.
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Report result
        run: echo "GitLab-to-GitHub mirror job completed."

  deploy-pages:
    name: Build and deploy documentation website
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Check out mirrored canonical website
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install documentation dependencies
        run: npm install --no-audit --no-fund
      - name: Stage generated feeds and public downloads in static
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static
          for directory in alt altsource downloads; do
            if [ -d "$directory" ]; then
              mkdir -p "static/$directory"
              cp -a "$directory/." "static/$directory/"
            fi
          done
          if [ -d static/altsource ]; then
            find static/altsource -maxdepth 1 -type f -name '*.json' -print
          fi
          test -s static/google48684d15ae18b623.html
          grep -Fxq 'google-site-verification: google48684d15ae18b623.html' static/google48684d15ae18b623.html
      - name: Build documentation and website
        run: npm run build
      - name: Verify published static output
        run: |
          set -euo pipefail
          test -s build/google48684d15ae18b623.html
          grep -Fxq 'google-site-verification: google48684d15ae18b623.html' build/google48684d15ae18b623.html
          test -s build/AltSource.json
          test -s "build/altsource/Xthrx's repo.json"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000
      - name: Retry Pages deployment if artifact lookup was transiently unavailable
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          error_count: 10
          reporting_interval: 5000
