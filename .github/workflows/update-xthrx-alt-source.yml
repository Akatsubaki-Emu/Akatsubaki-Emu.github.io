name: Update Xthrx's Repo

"on":
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "tools/xthrx-alt-source/**"
      - ".github/workflows/update-xthrx-alt-source.yml"

permissions:
  contents: write

concurrency:
  group: xthrx-alt-source
  cancel-in-progress: false

jobs:
  build:
    name: Validate feeds and publish catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install builder dependency
        run: |
          python -m pip install --disable-pip-version-check requests cairosvg pillow
          python -m pip check
      - name: Run offline regression tests
        working-directory: tools/xthrx-alt-source
        run: python -m unittest -v
      - name: Discover unique source manifests up to the 6,000-source target
        working-directory: tools/xthrx-alt-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python discover_sources.py
      - name: Render official app icon previews
        working-directory: tools/xthrx-alt-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python render_icon_previews.py
      - name: Refresh official Akatsubaki Emu release feeds
        working-directory: tools/xthrx-alt-source
        run: python sync_akatsubaki_source.py
      - name: Fetch, normalize and merge configured feeds
        working-directory: tools/xthrx-alt-source
        env:
          XTHRX_SOURCE_URL: https://akatsubaki-emu.github.io/altsource/Xthrx%27s%20repo.json
        run: python build_xthrx_repo.py
      - name: Stage generated source and health report
        run: |
          set -euo pipefail
          test -s "tools/xthrx-alt-source/docs/Xthrx's repo.json"
          test -s tools/xthrx-alt-source/docs/xthrx-source-report.json
          python -m json.tool AltSource.json >/dev/null
          python -m json.tool alt/source.json >/dev/null
          python -m json.tool "tools/xthrx-alt-source/docs/Xthrx's repo.json" >/dev/null
          python -m json.tool tools/xthrx-alt-source/docs/xthrx-source-report.json >/dev/null
          # Publish all official feeds from static/ so Docusaurus copies them
          # directly to the site root or the corresponding public subdirectory.
          mkdir -p static/altsource static/alt altsource
          python -m json.tool AltSource.json > static/AltSource.json
          python -m json.tool alt/source.json > static/alt/source.json
          python -m json.tool "tools/xthrx-alt-source/docs/Xthrx's repo.json" > "/tmp/Xthrx's repo.json"
          python -m json.tool tools/xthrx-alt-source/docs/xthrx-source-report.json > /tmp/xthrx-source-report.json
          cp "/tmp/Xthrx's repo.json" "static/altsource/Xthrx's repo.json"
          cp /tmp/xthrx-source-report.json static/altsource/xthrx-source-report.json
          cp "/tmp/Xthrx's repo.json" "altsource/Xthrx's repo.json"
          cp /tmp/xthrx-source-report.json altsource/xthrx-source-report.json
          cp static/AltSource.json AltSource.json
          cp static/alt/source.json alt/source.json
          # Validate the exact public files before committing them.
          python -m json.tool static/AltSource.json >/dev/null
          python -m json.tool static/alt/source.json >/dev/null
          python -m json.tool "static/altsource/Xthrx's repo.json" >/dev/null
          python -m json.tool static/altsource/xthrx-source-report.json >/dev/null
          test -s static/AltSource.json
          test -s static/alt/source.json
          test -s "static/altsource/Xthrx's repo.json"
      - name: Commit refreshed catalogue
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/xthrx-alt-source/sources.json AltSource.json alt/source.json static/AltSource.json static/alt/source.json static/altsource/ "altsource/Xthrx's repo.json" altsource/xthrx-source-report.json static/img/akatsubaki-icon-default.png static/img/akatsubaki-icon-simple.png
          if git diff --cached --quiet; then
            echo "Official app source and catalogue are already current."
            exit 0
          fi
          git commit -m "chore(altsource): refresh official feeds and Xthrx's Repo"
          # The Pages build and mirror workflow can update main while this
          # catalogue job is generating large JSON files. Rebase before each
          # push attempt so generated-feed commits never overwrite newer work.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase generated feeds onto the latest main; resolve the conflicting files and rerun."
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt was rejected by a concurrent update."
            sleep "$((attempt * 5))"
          done
          echo "::error::Could not publish generated feeds after three attempts."
          exit 1
