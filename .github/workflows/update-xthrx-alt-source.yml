name: Update Xthrx's Repo
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main, master]
    paths:
      - "tools/xthrx-alt-source/**"
      - ".github/workflows/update-xthrx-alt-source.yml"
permissions:
  contents: write
concurrency:
  group: xthrx-alt-source
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Merge all working feeds
        working-directory: tools/xthrx-alt-source
        env:
          XTHRX_SOURCE_URL: https://i-steam.github.io/altsource/Xthrx%27s%20repo.json
        run: python build_xthrx_repo.py
      - name: Copy generated files into the Pages site
        run: |
          mkdir -p altsource
          cp "tools/xthrx-alt-source/docs/Xthrx's repo.json" altsource/
          cp tools/xthrx-alt-source/docs/xthrx-source-report.json altsource/
      - name: Publish updated catalogue
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(altsource): refresh Xthrx's Repo"
          file_pattern: "altsource/*.json"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
